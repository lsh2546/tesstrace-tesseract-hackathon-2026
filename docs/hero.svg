<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">TessTrace localizes a silent UVS VJP failure</title><desc id="desc">Optics is partially contaminated, UVS fails, and VS, Human, and Thermal remain healthy. Fixed design improves UVS 5.1 percent and VS 7.5 percent.</desc>
  <rect width="1280" height="560" fill="#0b0d0e"/><text x="54" y="58" fill="#b9f44a" font-family="monospace" font-size="14" letter-spacing="2">TESSERACT GRADIENT FAULT LOCALIZATION</text>
  <text x="54" y="122" fill="#f5f3ee" font-family="Arial,sans-serif" font-size="50" font-weight="700">Silent VJP bug found at</text><text x="54" y="181" fill="#ff665f" font-family="Arial,sans-serif" font-size="58" font-weight="700">UVS Vision</text>
  <rect x="55" y="253" width="240" height="132" fill="#15191a" stroke="#323738"/><text x="78" y="287" fill="#969a9f" font-family="monospace" font-size="12">TESSERACT</text><text x="78" y="329" fill="#f5f3ee" font-family="Arial" font-size="28" font-weight="700">Optics</text><text x="78" y="360" fill="#f3b95f" font-family="monospace" font-size="12">PARTIALLY CONTAMINATED</text>
  <path d="M295 319 C370 319 385 267 460 267" fill="none" stroke="#f3b95f" stroke-width="3" stroke-dasharray="8 6"/><path d="M295 319 C370 319 385 334 460 334" fill="none" stroke="#75d89d" stroke-width="3"/><path d="M295 319 C370 319 385 401 460 401" fill="none" stroke="#75d89d" stroke-width="3"/>
  <rect x="460" y="225" width="330" height="82" fill="#15191a" stroke="#323738"/><rect x="460" y="225" width="5" height="82" fill="#ff665f"/><text x="485" y="260" fill="#f5f3ee" font-family="Arial" font-size="21" font-weight="700">UVS Vision</text><text x="720" y="260" fill="#ff665f" font-family="monospace" font-size="13">FAIL</text><text x="485" y="285" fill="#969a9f" font-family="monospace" font-size="11">RELATIVE ERROR 0.710</text>
  <rect x="460" y="317" width="330" height="55" fill="#15191a" stroke="#323738"/><rect x="460" y="317" width="5" height="55" fill="#75d89d"/><text x="485" y="351" fill="#f5f3ee" font-family="Arial" font-size="19">VS Vision</text><text x="720" y="351" fill="#75d89d" font-family="monospace" font-size="13">PASS</text>
  <rect x="460" y="382" width="330" height="55" fill="#15191a" stroke="#323738"/><rect x="460" y="382" width="5" height="55" fill="#75d89d"/><text x="485" y="416" fill="#f5f3ee" font-family="Arial" font-size="19">Human + Thermal</text><text x="720" y="416" fill="#75d89d" font-family="monospace" font-size="13">PASS</text>
  <line x1="850" y1="93" x2="1225" y2="93" stroke="#323738"/><text x="850" y="132" fill="#969a9f" font-family="Arial" font-size="16">Fixed design</text><text x="1225" y="132" text-anchor="end" fill="#f5f3ee" font-family="monospace" font-size="27" font-weight="700">UVS +5.1%</text><line x1="850" y1="163" x2="1225" y2="163" stroke="#323738"/><text x="850" y="202" fill="#969a9f" font-family="Arial" font-size="16">Sibling benefit</text><text x="1225" y="202" text-anchor="end" fill="#f5f3ee" font-family="monospace" font-size="27" font-weight="700">VS +7.5%</text><line x1="850" y1="233" x2="1225" y2="233" stroke="#323738"/>
  <text x="850" y="330" fill="#b9f44a" font-family="monospace" font-size="13">FORWARD IDENTICAL</text><text x="850" y="365" fill="#b9f44a" font-family="monospace" font-size="13">6 REAL TESSERACT IMAGES</text><text x="850" y="400" fill="#b9f44a" font-family="monospace" font-size="13">FAULTY / FIXED EXIT 1 / 0</text><text x="850" y="435" fill="#b9f44a" font-family="monospace" font-size="13">RAW JSON ARTIFACT</text>
